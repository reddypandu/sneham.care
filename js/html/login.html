<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - Senior Citizen Home</title>
  <link rel="stylesheet" href="../css/rej.css">
  <link rel="stylesheet" href="../css/login.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>

  <div class="home-icon-box">
    <a href="../index.html" class="home-link">
      <i class="bi bi-house-door-fill"></i> Home
    </a>
  </div>

  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Enter Admin Email" required />
      <input type="password" id="password" placeholder="Enter Password" required />
      <button type="button" id="send-otp">Send OTP</button>

      <div id="otp-section" style="display: none;">
        <input type="text" id="otp" placeholder="Enter OTP" required />
        <button type="submit">Login</button>
      </div>
      <p id="message" class="error-message"></p>
    </form>
  </div>


<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function() {
    emailjs.init("chiOKsbCswt339aq2"); // Your public key
  })();
</script>
<script src="../js/login.js"></script>

</body>
</html>
